let view='home', tab='itinerary', day=0;
const trip=DATA.trips[0];
const names={itinerary:'每日行程',transport:'交通',stays:'住宿',bookings:'活動票券',packing:'行李清單',sources:'待確認與來源',review:'旅後回顧'};
const main=document.getElementById('main');
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rich(t){return esc(t).replace(/&lt;br&gt;/g,'<br>');}
function footer(){return `<footer class="footer"><span>旅行資料更新於 2026.10.04 · 旅行手帳</span><span id="photo-credit">封面照片：<a href="https://commons.wikimedia.org/wiki/File:Dove_Lake_and_Cradle_Mountain.jpg" target="_blank" rel="noopener">Karora / Wikimedia Commons · Public domain</a></span></footer>`;}
function home(){return `<div class="heading"><div><div class="eyebrow">YOUR TRAVEL COLLECTION</div><h1>每一趟，都值得記下</h1><p class="sub">回看走過的路，也為下一次出發留個位置。</p></div><span class="year">2026 年</span></div><div class="stats"><div class="stat"><strong>${DATA.trips.length.toString().padStart(2,'0')}</strong><span>已收錄旅行</span><small>從澳洲這一趟開始</small></div><div class="stat"><strong>11</strong><span>旅程日曆日</span><small>包含出發與返台日</small></div><div class="stat"><strong>02</strong><span>主要旅行地區</span><small>墨爾本 · 塔斯馬尼亞</small></div></div><div class="section-title"><h2>我的旅行</h2><span>已完成 · 1 趟</span></div><article class="trip-card"><div class="cover"><img src="assets/cover.jpg" alt="澳洲塔斯馬尼亞鴿子湖與搖籃山景色"><span class="cover-label">AUSTRALIA / 2026</span></div><div class="card-content"><span class="badge">已完成的旅行</span><h2>墨爾本＋塔斯馬尼亞</h2><div class="english">Melbourne & Tasmania</div><p class="date">2026.09.18 — 09.28 · 11 個日曆日</p><div class="tags"><span>公路旅行</span><span>山林健行</span><span>咖啡與城市散步</span></div><div class="card-bottom"><small>原計畫已整理 · 實際紀錄待補</small><button class="primary" data-view="trip">查看行程</button></div></div></article><div class="bottom-grid"><section class="note-card"><h3>下一站，想去哪裡？</h3><p>先收藏目的地，等有了日期，再慢慢排成一趟旅行。</p><button class="text-button" data-view="wishlist">查看想去的地方</button></section><section class="note-card"><h3>把旅途的細節補回來</h3><p>這趟有不同版本的航班與住宿資料，已保留來源，方便之後核對。</p><button class="text-button" data-action="sources">查看待確認事項</button></section></div>${footer()}`;}
function itinerary(){const d=trip.days[day];return `<div class="notice">這裡保存當時的安排。實際走法與花費，可在旅後回顧中補上。</div><div class="day-layout"><div class="days" aria-label="選擇日期">${trip.days.map((d,i)=>`<button data-day="${i}" class="${day===i?'current':''}" aria-pressed="${day===i}">${esc(d.title.length>18?(d.title.startsWith('日期')?'集合日期待確認':d.title):d.title)}<small>${d.title.startsWith('9/')?'原計畫':'補充資料'}</small></button>`).join('')}</div><section class="day-panel"><div class="eyebrow">TRIP ITINERARY</div><h2>${esc(d.title)}</h2>${d.entries.map(r=>`<article class="event"><div class="event-time">${rich(r[1]||'時間未記錄')}</div><h3>${rich(r[2]||'移動與補充安排')}</h3>${r[3]?`<p>${rich(r[3])}</p>`:''}${r[4]?`<p>${rich(r[4])}</p>`:''}${r[5]?`<div class="meta">${rich(r[5])}</div>`:''}${r[6]?`<p>住宿：${rich(r[6])}</p>`:''}</article>`).join('')}</section></div>`;}
function detail(){return `<button class="back" data-view="home">回到旅行總覽</button><div class="detail-head"><div><div class="eyebrow">AUSTRALIA / TRIP 001</div><h1>${esc(trip.title)}</h1><p>2026.09.18 — 09.28 · 新加坡轉機 · 塔斯馬尼亞自駕</p></div><span class="badge">已完成 · 實際紀錄待補</span></div><div class="tabs" aria-label="行程資料分類">${Object.entries(names).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'selected':''}" aria-pressed="${tab===k}">${v}</button>`).join('')}</div>${tab==='itinerary'?itinerary():`<article class="doc">${trip.docs[tab]}</article>`}${footer()}`;}
function secondary(){const wish=view==='wishlist';return `<div class="heading"><div><div class="eyebrow">${wish?'PLACES TO GO':'TRAVEL YOUR WAY'}</div><h1>${wish?'想去的地方':'我的旅遊偏好'}</h1><p class="sub">${wish?'下一次旅行，從一個想法開始。':'讓每次規劃，都更貼近自己的步調。'}</p></div></div><article class="doc">${DATA[view]}</article><section class="empty" style="margin-top:22px"><h2>${wish?'記下下一站':'讓下一趟更適合你'}</h2><p>在專案中告訴旅行助手，整理後就能更新到手帳。</p><code>${wish?'用 $travel-manager 把京都加入願望清單，想在秋天去看楓葉。':'幫我記住旅遊偏好：每天最多安排兩個主要景點，留時間散步。'}</code></section>${footer()}`;}
function render(){main.innerHTML=view==='home'?home():view==='trip'?detail():secondary();document.getElementById('crumb').textContent={home:'總覽',trip:'澳洲旅行',wishlist:'想去的地方',preferences:'旅遊偏好'}[view];document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0);}else if(b.dataset.tab){tab=b.dataset.tab;render();}else if(b.dataset.day){day=Number(b.dataset.day);render();}else if(b.dataset.action==='sources'){view='trip';tab='sources';render();window.scrollTo(0,0);}});
render();
</script></body></html>
