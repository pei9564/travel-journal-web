: [{"name": "布魯尼島渡輪", "description": "車子也一起上船，跨越海峽後便接上島上的公路。南北布魯尼島由一條狹長地峽相連。", "url": "https://www.discovertasmania.com.au/regions/hobart-and-south/bruny-island/", "checked_at": "2026-10-04"}], "Bruny Island 布魯尼島": [{"name": "Get Shucked 生蠔", "description": "島上的生蠔養殖場兼生蠔吧，以在地生蠔為主角；連開車外帶也有專門的得來速窗口。", "url": "https://www.getshucked.com.au/", "checked_at": "2026-10-04"}, {"name": "Bruny Island Cheese Co.", "description": "以傳統方式製作與熟成的手工起司，搭配自家啤酒，是布魯尼島美食路線的一站。", "url": "https://www.discovertasmania.com.au/things-to-do/food-and-drink/brunyislandcheeseco/", "checked_at": "2026-10-04"}, {"name": "Bruny Island Chocolate・Honey", "description": "沿著島上主路串起巧克力、蜂蜜等小店，海岸風景之外，也能認識島上的在地食材。", "url": "https://www.discovertasmania.com.au/regions/hobart-and-south/bruny-island/", "checked_at": "2026-10-04"}, {"name": "Bread Fridge", "description": "路邊冰箱裡放著 Bruny Baker 的柴燒酸種麵包，是這座小島很有辨識度的鄉間風景。", "url": "https://www.sheepwashbay.com/explore", "checked_at": "2026-10-04"}, {"name": "The Neck", "description": "狹長地峽把南北兩座島接起來。登上觀景台，兩側海灣和沙灘在腳下展開。", "url": "https://www.discovertasmania.com.au/things-to-do/nature-and-wildlife/brunyislandneck/", "checked_at": "2026-10-04"}], "Sorell 休息": [{"name": "Sorell", "description": "前往塔斯曼半島與東岸前的重要小鎮，街上保留著早期教堂與歷史建築，也是長途開車中途補給的地方。", "url": "https://www.discovertasmania.com.au/regions/hobart-and-south/sorell/", "checked_at": "2026-10-04"}], "里其蒙小鎮": [{"name": "Richmond・里奇蒙橋", "description": "砂岩老屋與喬治亞式建築沿街排列，1825 年建成的石橋跨過河面，小鎮的歷史感就藏在這些日常景色裡。", "url": "https://www.discovertasmania.com.au/regions/hobart-and-south/richmond/", "checked_at": "2026-10-04"}, {"name": "Richmond Bakery", "description": "小鎮麵包店供應塔斯馬尼亞風味烘焙點心，干貝派把海鮮滋味包進酥皮裡。", "url": "https://www.discovertasmania.com.au/regions/hobart-and-south/richmond/", "checked_at": "2026-10-04"}, {"name": "Coal River Farm", "description": "把起司、巧克力製作與農場餐廳放在一起，從手工甜點一路延伸到 Coal River Valley 的田園景色。", "url": "https://www.discovertasmania.com.au/things-to-do/food-and-drink/coalriverfarm/", "checked_at": "2026-10-04"}], "塔斯曼半島海岸線": [{"name": "Eaglehawk Neck・棋盤石", "description": "海岸岩面被切割成一格格近似棋盤的紋理，是半島很特別的地質景觀。", "url": "https://www.tasman.org.au/things-to-see-and-do/scenery", "checked_at": "2026-10-04"}, {"name": "天然拱門・惡魔廚房", "description": "海浪長年侵蝕岩壁，形成巨大的天然石拱與深切海蝕地形，景色帶著塔斯曼海岸的粗獷感。", "url": "https://www.tasman.org.au/things-to-see-and-do/scenery", "checked_at": "2026-10-04"}], "午餐 1830 Restaurant & Bar": [{"name": "1830 Restaurant & Bar", "description": "位在亞瑟港歷史遺址，以塔斯曼半島及周邊食材入菜，把這段旅程的風土延伸到餐桌。", "url": "https://portarthur.org.au/1830restaurant/", "checked_at": "2026-10-04"}], "Port Arthur 亞瑟港歷史遺址": [{"name": "亞瑟港歷史遺址", "description": "海灣旁的建築遺跡，保存了澳洲流放犯聚落的歷史。Isle of the Dead 島上的墓園，記錄著曾在這裡生活的人們。", "url": "https://portarthur.org.au/whats-on/isle-of-the-dead-cemetery-tour/", "checked_at": "2026-10-04"}], "休息": [{"name": "Port Arthur Motor Inn Restaurant", "description": "餐廳朝向亞瑟港歷史聚落，窗外的遺址與海灣景色，讓晚餐也接續著白天的歷史散步。", "url": "https://www.portarthur-inn.com.au/restaurant", "checked_at": "2026-10-04"}], "大東方公路（Great Eastern Drive）": [{"name": "Great Eastern Drive", "description": "沿塔斯馬尼亞東岸串起沙灘、森林與海鮮產地；沿途景色在海灣和鄉間之間慢慢變換。", "url": "https://www.discovertasmania.com.au/things-to-do/road-trips/7-reasons-to-love-the-great-eastern-drive/", "checked_at": "2026-10-04"}], "Freycinet Marine Farm 海鮮農場": [{"name": "Freycinet Marine Farm", "description": "以自家養殖的生蠔與淡菜為特色，從東岸海域到餐桌的距離很近。", "url": "https://www.discovertasmania.com.au/things-to-do/itineraries/4-days-on-freycinet-peninsula/", "checked_at": "2026-10-04"}], "菲欣納國家公園 (Freycinet National Park)": [{"name": "Freycinet・酒杯灣", "description": "白沙海灣、藍綠海水與粉紅色山岩，是半島的代表風景。酒杯灣像一道完整的弧線，從高處望下特別清楚。", "url": "https://www.discovertasmania.com.au/things-to-do/itineraries/4-days-on-freycinet-peninsula/", "checked_at": "2026-10-04"}, {"name": "蜜月灣", "description": "花崗岩丘與小海灣相接，是菲欣納國家公園裡較貼近水面的另一種景色。", "url": "https://parks.tas.gov.au/explore-our-parks/freycinet-national-park/richardsons-beach-honeymoon-bay-and-ranger-creek-camping", "checked_at": "2026-10-04"}], "羅斯小鎮": [{"name": "Ross", "description": "榆樹夾道、砂岩建築與老石橋，保留著塔斯馬尼亞早期村鎮的輪廓，街道適合慢慢走。", "url": "https://www.rossbakery.com.au/rossvillage.html", "checked_at": "2026-10-04"}, {"name": "Ross Bakery", "description": "以柴燒烘焙延續老麵包店的風格，酸種麵包、干貝派和香草千層切片都是店家的代表品項。", "url": "https://www.rossbakery.com.au/m/index.html", "checked_at": "2026-10-04"}, {"name": "塔斯馬尼亞羊毛中心", "description": "從剪羊毛場景與歷史展品，認識小鎮和羊毛產業的關係；館內也展示羊毛製品。", "url": "https://www.spiritoftasmania.com.au/things-to-do/ross-visitor-information-centre/", "checked_at": "2026-10-04"}], "鴿子湖環湖步道": [{"name": "鴿子湖", "description": "冰河雕塑出的湖泊就在搖籃山下，環湖步道穿過雨林與湖岸，能從不同角度看山峰和水面的交會。", "url": "https://parks.tas.gov.au/explore-our-parks/cradle-mountain/dove-lake", "checked_at": "2026-10-04"}], "搖籃山國家公園 (Cradle Mountain)": [{"name": "搖籃山", "description": "山峰、冰河湖與雨林構成這一帶的景色；鴿子湖步道上的植被，從鈕扣草一路變換到古老樹林。", "url": "https://parks.tas.gov.au/explore-our-parks/cradle-mountain/dove-lake", "checked_at": "2026-10-04"}], "馬拉庫帕洞穴（Marakoopa Cave）": [{"name": "Marakoopa Cave", "description": "地下溪流的聲音伴著洞穴導覽，黑暗中成片的 glow-worm 微光像星空，和地面上的山林形成截然不同的景色。", "url": "https://www.discovertasmania.com.au/things-to-do/nature-and-wildlife/molecreekkarstnationalpark/", "checked_at": "2026-10-04"}], "Trowunna Wildlife Sanctuary": [{"name": "Trowunna Wildlife Sanctuary", "description": "Mole Creek 一帶的野生動物保育園區，可以認識塔斯馬尼亞惡魔等當地特有動物。", "url": "https://www.discovertasmania.com.au/regions/launceston-and-north/mole-creek/", "checked_at": "2026-10-04"}], "朗瑟斯頓市區": [{"name": "Launceston", "description": "位在三條河流交會處的塔斯馬尼亞北部城市，也以飲食文化聞名，適合用一頓晚餐替自駕旅程收尾。", "url": "https://www.discovertasmania.com.au/regions/launceston-and-north/launceston/", "checked_at": "2026-10-04"}], "Good Measure / Lune Croissanterie / Monforte Viennoiserie / Fitzroy 咖啡甜點散步": [{"name": "Good Measure", "description": "咖啡館帶著日式影響，Mont Blanc 把濾泡咖啡、鮮奶油、肉豆蔻與橙皮香氣疊在一起，像一杯可以喝的甜點。", "url": "https://www.broadsheet.com.au/melbourne/carlton/cafes/good-measure", "checked_at": "2026-10-04"}, {"name": "Lune Croissanterie", "description": "專注製作可頌，從麵團、折層到烘烤都講究精準與時間；重點是可頌本身細緻的層次。", "url": "https://lunecroissanterie.com/about/", "checked_at": "2026-10-04"}, {"name": "Monforte Viennoiserie", "description": "Carlton North 的小批量烘焙店，糕點與果醬跟著季節水果更換，把當令食材放進歐式酥點。", "url": "https://monforte.com.au/about", "checked_at": "2026-10-04"}, {"name": "Fitzroy", "description": "咖啡館、獨立商店、酒吧和現場音樂散布在街區裡，適合一邊散步，一邊留意街角的小店。", "url": "https://www.visitvictoria.com/Regions/Melbourne/Destinations/Fitzroy?isMobile=true", "checked_at": "2026-10-04"}], "State Library Victoria、免稅店、Aesop": [{"name": "維多利亞州立圖書館", "description": "La Trobe 閱覽室的高聳圓頂與放射狀書桌，是圖書館最鮮明的畫面，抬頭和俯瞰有不同的建築層次。", "url": "https://www.slv.vic.gov.au/visit/our-magnificent-spaces/la-trobe-reading-room", "checked_at": "2026-10-04"}, {"name": "Aesop", "description": "以香氛與身體、頭髮、肌膚保養品為主，店面也很重視材料與空間設計，逛店時可以一起留意。", "url": "https://whatson.melbourne.vic.gov.au/shop/aesop", "checked_at": "2026-10-04"}], "墨爾本海岸線": [{"name": "大洋路・十二使徒岩・倫敦拱門", "description": "海浪把石灰岩海岸慢慢切成峭壁、岩柱與拱門。十二使徒岩與倫敦拱門，都是這段海岸持續變化留下的形狀。", "url": "https://www.dcceew.gov.au/parks-heritage/heritage/places/national/great-ocean-road", "checked_at": "2026-10-04"}], "Puffing Billy 蒸汽火車半日遊": [{"name": "Puffing Billy", "description": "保存下來的窄軌鐵路穿過丹頓農山區，在森林間以蒸汽火車的節奏旅行。", "url": "https://puffingbillyrailway.org.au/visit-us/", "checked_at": "2026-10-04"}], "新加坡": [{"name": "SATS 貴賓室", "description": "設在樟宜機場轉機區，讓長途航班之間多一段坐下休息的時間。", "url": "https://www.changiairport.com/in/en/at-changi/facilities-and-services-directory/sats-premier-lounge.html", "checked_at": "2026-10-04"}]}, "memories": {"days": {}}, "start": "2026-09-18", "end": "2026-09-28", "duration": 11, "countries": ["Australia"], "english": "Melbourne & Tasmania", "country_label": "AUSTRALIA", "subtitle": "新加坡轉機 · 塔斯馬尼亞自駕", "tags": ["公路旅行", "山林健行", "咖啡與城市散步"], "cover": "assets/cover.jpg", "cover_alt": "澳洲塔斯馬尼亞鴿子湖與搖籃山景色", "credit_name": "Karora", "credit_url": "https://commons.wikimedia.org/wiki/File:Dove_Lake_and_Cradle_Mountain.jpg", "license_name": "Public domain", "license_url": "http =194514", "checked_at": "2026-10-04"}], "倫敦貝果博物館": [{"name": "倫敦貝果博物館", "description": "帶著英式復古佈置的貝果專門咖啡館，主角是不同口味的貝果與抹醬，店名也充滿玩心。", "url": "https://english.visitseoul.net/restaurants/LondonBagelMuseumDosan/ENPxyqzye", "checked_at": "2026-10-04"}], "Cafe Onion": [{"name": "Cafe Onion", "description": "安國店把老韓屋的木地板與庭院保留下來，咖啡和烘焙麵包被放進傳統建築的日常空間。", "url": "https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=191156", "checked_at": "2026-10-04"}], "北村八景": [{"name": "北村八景", "description": "北村的坡道與窄巷穿梭在韓屋之間，重疊屋瓦與遠處城市景色，是散步時最鮮明的畫面。", "url": "https://english.visitkorea.or.kr/svc/contents/infoHtmlView.do?vcontsId=194514", "checked_at": "2026-10-04"}], "三清洞": [{"name": "三清洞", "description": "宮牆旁的街道連著北村，韓屋、咖啡館與小型藝廊交錯，適合把步調放慢。", "url": "https://english.visitseoul.net/artsinseoul/Samcheong/ENNvb165i", "checked_at": "2026-10-04"}, {"name": "三清洞麵疙瘩", "description": "手工麵疙瘩盛在傳統韓式陶鍋裡，熱湯與不規則麵片是這道料理的樸實特色。", "url": "https://english.visitseoul.net/eat/Samcheong-dong/ENP002121", "checked_at": "2026-10-04"}, {"name": "紅豆湯", "description": "韓式甜紅豆粥常搭配軟糯年糕與栗子，濃稠的口感很適合街區散步之間的小歇。", "url": "https://big5chinese.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=90596", "checked_at": "2026-10-04"}], "東大門汗蒸幕": [{"name": "汗蒸幕", "description": "韓式汗蒸幕把浴場、熱室與休息空間結合，是逛街之後坐下、放慢節奏的去處。", "url": "https://english1.visitkorea.or.kr/enu/ATR/SI_ENG_2_9_2.jsp", "checked_at": "2026-10-04"}], "陳玉華一隻雞": [{"name": "陳玉華一隻雞", "description": "整隻雞放進高湯裡滾煮，搭配蔥、馬鈴薯與年糕，最後還能用湯底續煮麵條。", "url": "https://big5chinese.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=86212", "checked_at": "2026-10-04"}], "無垢屋": [{"name": "無垢屋", "description": "以雞肉料理為主，使用鑄鐵大鍋長時間熬湯，重點是雞湯本身的濃郁滋味。", "url": "https://tchinese.visitseoul.net/restaurants/MUGUOK/TCP8ndtkv", "checked_at": "2026-10-04"}], "Artist bakery": [{"name": "Artist Bakery", "description": "以鹽麵包為主角的安國烘焙店，從原味到甜、鹹口味都有變化，很適合和附近咖啡館串成一段散步。", "url": "https://seoulplate.com/best-salt-bread-in-seoul/", "checked_at": "2026-10-04"}], "弘大逛街": [{"name": "弘大", "de ore-the-ancient-town-of-hoi-an", "checked_at": "2026-10-04"}, {"name": "Mót", "description": "以香茅、檸檬等草本香氣為特色的飲品店，藏在古鎮 Trần Phú 路上的街屋之間。", "url": "https://mothoian.vn/en/", "checked_at": "2026-10-04"}, {"name": "水蕨糕 Bánh Bèo", "description": "小份的米製點心搭配蝦、肉等配料，常以一份數個的方式分享，是越南街頭常見的鹹點。", "url": "https://vietnam.travel/node/1498", "checked_at": "2026-10-04"}], "夜間放水燈": [{"name": "會安水燈", "description": "古鎮入夜後，燈籠倒映在河面上；搭小船、放下承載願望的水燈，是這裡很鮮明的夜間景色。", "url": "https://vietnam.travel/things-to-do/the-best-ways-to-explore-the-ancient-town-of-hoi-an", "checked_at": "2026-10-04"}], "Morning Glory Original": [{"name": "Morning Glory Original", "description": "用開放式廚房呈現會安地方料理，從高樓麵到白玫瑰等小吃，把古鎮的飲食傳統放在同一張餐桌上。", "url": "https://tastevietnam.maisonvy.com/morning-glory-restaurant-hoi-an", "checked_at": "2026-10-04"}], "迦南島桶船體驗": [{"name": "迦南島桶船", "description": "圓形竹籃船沿著 Cẩm Thanh 的水椰林水道前進，兩側葉片和水面包圍著小船，是會安郊外的河口景色。", "url": "https://danangfantasticity.com/en/bay-mau-coconut-forest", "checked_at": "2026-10-04"}], "Madam Khanh": [{"name": "Madam Khanh", "description": "以越式法國麵包聞名的小店，也被稱作 Bánh Mì Queen；把配料夾入麵包，是會安街頭方便邊走邊吃的一餐。", "url": "https://www.hoianworldheritage.org.vn/en/news/Traditionnal-Hoi-An-food/queen-of-the-scene-madam-khanh-s-banh-mi-in-hoi-an-836.hwh", "checked_at": "2026-10-04"}], "92 Station Cafe": [{"name": "92 Station Cafe", "description": "天台視野越過會安古鎮的瓦片屋頂，從高處看黃色街屋與街道，是這間咖啡館最有辨識度的角度。", "url": "https://hoianlocal.com/business/92-station-restaurant-cafe/", "checked_at": "2026-10-04"}], "DIY 燈籠體驗": [{"name": "會安燈籠手作", "description": "燈籠是會安的文化符號之一，手作體驗把街頭看見的色彩變成可以親手完成、帶走的小物。", "url": "https://2025.vietnam.travel/en/cooking-and-lantern-making-in-hoi-an/", "checked_at": "2026-10-04"}], "Bếp Cuốn Đà Nẵng": [{"name": "Bếp Cuốn", "description": "綠植、燈籠與竹材構成輕鬆的用餐空間，菜單集合越南南北料理，春捲拼盤與不同沾醬是其中的特色。", "url": "https://guide.michelin.com/en/da-nang-region/da-nang_2984390/restaurant/bep-cuon", "checked_at": "2026-10-04"}], "巴拿山 Sun World": [{"name": "巴拿山・佛手金橋", "description": "巨大的雙手托起金色步道，橋身沿著山腰延伸，把山巒和遠方海岸納入視野。", "url": "https://vietnam.travel/node/914", "checked_at": "2026-10-04"}, {"name": "法國村", "description": "用廣場、教堂與歐式街屋組成山上的主題村落，建築造型和山區環境形成特別的組合。", "url": "https://sunworld.vn/en/banahills/activities/french-village", "checked_at": "2026-10-04"}], "Mộc Quán": [{"name": "Mộc Quán", "description": "樹間燈串與戶外座位營造出庭院般的氣氛，水箱裡的海鮮可用不同東南亞風味烹調。", "url": "https://guide.michelin.com/en/da-nang-region/da-nang_2984390/restaurant/moc", "checked_at": "2026-10-04"}], "越式烤肉粉卷": [{"name": "Bánh Cuốn", "description": "把現蒸米漿做成薄皮，再捲入餡料，是越南常見的米製早餐；軟薄外皮和沾醬形成主要口感。", "url": "https://vietnam.travel/node/780", "checked_at": "2026-10-04"}], "漢市場・粉紅大教堂": [{"name": "漢市場", "description": "市中心的傳統市場，攤位聚集在一起，採買地方食品與逛市場的生活氣氛可以一次感受。", "url": "https://danangfantasticity.com/en/famous-local-markets-in-danang", "checked_at": "2026-10-04"}, {"name": "粉紅大教堂", "description": "法國殖民時期興建的教堂，粉紅外牆讓它在市中心街景裡十分醒目。", "url": "https://danangfantasticity.com/cn/3-perfect-days-in-danang", "checked_at": "2026-10-04"}], "婆養煎餅": [{"name": "Bánh Xèo Bà Dưỡng", "description": "巷弄裡的越式煎餅店，把酥脆煎餅、烤肉、新鮮香草與米紙搭在一起，再蘸上肉末花生醬。", "url": "https://guide.michelin.com/us/en/da-nang-region/da-nang_2984390/restaurant/banh-xeo-ba-duong", "checked_at": "2026-10-04"}], "越式洗頭按摩": [{"name": "越式洗頭按摩", "description": "常把洗髮和頭頸按摩結合，也會使用草本香氣，讓梳洗成為一段可以躺下休息的時間。", "url": "https://chamspa.vn/head-spa-vs-goi-dau-duong-sinh/", "checked_at": "2026-10-04"}], "美溪沙灘": [{"name": "美溪沙灘", "description": "海灘緊接著峴港市區，寬闊海面、海風與沿岸餐飲，讓城市散步很自然地延伸到海邊。", "url": "https://danangfantasticity.com/en/bien-my-khe", "checked_at": "2026-10-04"}], "Luk Lak": [{"name": "Luk Lak", "description": "位在漢江岸邊，綠植包圍用餐空間；菜色以越南料理為基礎，帶入香草和較鮮明的風味組合。", "url": "https://guide.michelin.com/en/da-nang-region/da-nang_2984390/restaurant/luk-lak-1211910", "checked_at": "2026-10-04"}], "搭船遊漢江": [{"name": "漢江・龍橋", "description": "龍形橋身橫跨漢江，夜間燈光映在水面上；噴火與噴水表演則讓橋樑本身成為城市舞台。", "url": "https://danangfantasticity.com/en/dragon-bridge", "checked_at": "2026-10-04"}], "自由活動": [{"name": "茶山半島", "description": "森 let view='home', day=0, collapsed=false;
let trip=DATA.trips[0];
const main=document.getElementById('main');
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rich(t){return esc(t).replace(/&lt;br&gt;/g,'<br>');}
function footer(){const photos=view==='trip'?[trip]:DATA.trips;return `<footer class="footer"><span>旅行手帳 · 2026.10.04</span><span class="photo-credits">${photos.filter(t=>t.credit_name&&!t.memories?.cover).map(t=>`<span><a href="${esc(t.credit_url)}" target="_blank" rel="noopener">${esc(t.credit_name)}</a> · <a href="${esc(t.license_url)}" target="_blank" rel="noopener">${esc(t.license_name)}</a>${t.cover_changes?' · '+esc(t.cover_changes):''}</span>`).join('<br>')}</span></footer>`;}

function dateRange(t){return t.duration?`${t.start.replaceAll('-','.')} — ${t.end.replaceAll('-','.')} · ${t.duration} 天`:'日期待定';}
function coverPhoto(t){return t.memories?.cover||{src:t.cover,alt:t.cover_alt};}
function photoButton(p,cls=''){return `<button class="${cls}" data-photo="${esc(p.src)}" data-alt="${esc(p.alt||'旅行照片')}" data-caption="${esc(p.caption||'')}" aria-label="放大${esc(p.alt||'旅行照片')}"><img src="${esc(p.src)}" alt="${esc(p.alt||'旅行照片')}" loading="lazy">${cls==='detail-cover'?'<span class="photo-hint">點開照片 ↗</span>':''}</button>`;}
function tripCard(t){t={...t,cover:coverPhoto(t).src,cover_alt:coverPhoto(t).alt};return `<article class="trip-card"><div class="cover ${t.cover?'':'type-cover'}">${t.cover?`<img src="${esc(t.cover)}" alt="${esc(t.cover_alt)}">`:`<div class="destination-type"><small>${esc(t.start.slice(0,4))} / TRAVEL JOURNAL</small><strong>${esc((t.english||t.title).toUpperCase())}</strong><span>${esc(t.start.slice(5).replace('-','.'))} — ${esc(t.end.slice(5).replace('-','.'))}</span></div>`}<span class="cover-label">${esc(t.country_label||'TRAVEL')} / ${esc(t.start.slice(0,4))}</span></div><div class="card-content"><span class="badge">${t.status==='completed'?'已完成的旅行':'規劃中的旅行'}</span><h2>${esc(t.title)}</h2><div class="english">${esc(t.english||'')}</div><p class="date">${esc(dateRange(t))}</p><div class="tags">${(t.tags||[]).map(tag=>`<span>${esc(tag)}</span>`).join('')}</div><div class="card-bottom"><small>${t.duration??""} 天旅行</small><button class="primary" data-trip="${esc(t.id)}">查看行程</button></div></div></article>`;}
function home(){const years=[...new Set(DATA.trips.map(t=>t.duration?t.start.slice(0,4):'待出發'))].sort().reverse();const countries=new Set(DATA.trips.flatMap(t=>t.countries));return `<div class="heading"><div><div class="eyebrow">YOUR TRAVEL COLLECTION</div><h1>每一趟，都值得記下</h1><p class="sub">回看走過的路，也為下一次出發留個位置。</p></div><span class="year">${[...new Set(DATA.trips.map(t=>t.start.slice(0,4)))].sort().join(' · ')} 年</span></div><div class="stats"><div class="stat"><strong>${String(DATA.trips.length).padStart(2,'0')}</strong><span>已收錄旅行</span><small>每一趟旅行都在這裡</small></div><div class="stat"><strong>${DATA.trips.reduce((sum,t)=>sum+(t.duration||0),0)}</strong><span>旅程日曆日</span><small>包含出發與返台日</small></div><div class="stat"><strong>${String(countries.size).padStart(2,'0')}</strong><span>旅行國家</span><small>依已收錄行程統計</small></div></div>${years.map(year=>`<section class="year-group" aria-label="${esc(year)}旅行"><div class="year-heading"><h2>${esc(year)}</h2><span>${DATA.trips.filter(t=>(t.duration?t.start.slice(0,4):'待出發')===year).length} 趟旅行</span></div><div class="trip-list">${DATA.trips.filter(t=>(t.duration?t.start.slice(0,4):'待出發')===year).sort((a,b)=>b.start.localeCompare(a.start)).map(tripCard).join('')}</div></section>`).join('')}<div class="bottom-grid"><section class="note-card"><h3>下一站，想去哪裡？</h3><p>先收藏目的地，等有了日期，再慢慢排成一趟旅行。</p><button class="text-button" data-view="wishlist">查看想去的地方</button></section><section class="note-card"><h3>出發前，照表打包</h3><p>把常用物品整理成 3 天、5 天與 10 天清單，依旅行長度準備。</p><button class="text-button" data-view="packing">查看行李清單</button></section></div>${newTrip()}${footer()}`;}

function placeStories(title){const places=trip.places?.[title]||[];return places.length?`<div class="place-stories"><span class="place-preview">${esc(places[0].description.length>52?places[0].description.slice(0,52)+'…':places[0].description)}</span><details><summary>景點介紹與來源</summary>${places.map(p=>`<p><strong>${esc(p.name)}</strong> · ${esc(p.description)} <a class="place-source" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">介紹 ↗</a></p>`).join('')}</details></div>`:'';}
function dayMemory(d){const m=trip.memories?.days?.[d.title]||{};return `${m.note?`<aside class="memory"><small>這天的小記</small><p>${esc(m.note)}</p></aside>`:''}${m.photos?.length?`<div class="day-photos">${m.photos.map(p=>photoButton(p)).join('')}</div>`:''}`;}
function itinerary(){const d=trip.days[day];if(!d)return '<section class="empty"><p>行程慢慢整理中。</p></section>';return `<div class="day-layout"><div class="days" aria-label="選擇日期">${trip.days.map((d,i)=>`<button data-day="${i}" class="${day===i?'current':''}" aria-pressed="${day===i}">${esc(d.title)}<small>每日行程</small></button>`).join('')}</div><section class="day-panel"><div class="eyebrow">TRIP ITINERARY</div><div class="day-heading"><button class="day-toggle" data-collapse aria-expanded="${!collapsed}"><h2>${esc(d.title)}</h2><span>${collapsed?'展開 ＋':'收合 −'}</span></button></div><div class="day-content" ${collapsed?'hidden':''}>${dayMemory(d)}${d.entries.map(r=>`<article class="event"><div class="event-time">${rich(r[1]||'行程安排')}</div><h3>${rich(r[2]||'移動與補充安排')}</h3>${placeStories(r[2])}${r[3]?`<p>${rich(r[3])}</p>`:''}${r[4]?`<p>${rich(r[4])}</p>`:''}${r[5]?`<div class="meta">${rich(r[5])}</div>`:''}${r[6]?`<p>住宿：${rich(r[6])}</p>`:''}</article>`).join('')}</div><div class="day-pager"><button data-day="${day-1}" ${day===0?'disabled':''}>← 前一天</button><button data-day="${day+1}" ${day===trip.days.length-1?'disabled':''}>下一天 →</button></div></section></div>`;}
function detail(){return `<button class="back" data-view="home">回到旅行總覽</button><div class="trip-switcher" aria-label="選擇旅行">${DATA.trips.map(t=>`<button data-trip="${esc(t.id)}" class="${t.id===trip.id?'selected':''}" aria-pressed="${t.id===trip.id}">${esc(t.title)}</button>`).join('')}</div><div class="detail-head"><div><div class="eyebrow">${esc(trip.country_label||'TRAVEL')} / ${esc(trip.start.slice(0,4))}</div><h1>${esc(trip.title)}</h1><p>${esc(dateRange(trip))} · ${esc(trip.subtitle||'')}</p></div><span class="badge">${trip.status==='completed'?'已完成的旅行':'規劃中'}</span></div>${coverPhoto(trip).src?photoButton(coverPhoto(trip),'detail-cover'):""}${itinerary()}${footer()}`;}

function newTrip(){return `<section class="note-card new-trip"><h3>慢慢加上下一趟</h3><p>把下面這段貼給旅行助手，附上筆記或截圖，就能沿用這本手帳的格式。日期還沒決定也可以開始。</p><textarea id="trip-request" aria-label="新增旅行訊息">幫我新增一趟旅行
地點：
日期或天數：
已有的筆記／想去的地方：
希望的步調：
請整理每日行程，未知資訊先留待確認。</textarea><button class="primary" data-copy>複製新增旅行訊息</button><span class="copy-status" role="status"></span><p style="margin-top:16px">想補回憶時，傳一張照片並告訴旅行助手是哪一趟、哪一天，也可以只補一句小記。</p></section>`;}
function packing(){return `<div class="heading"><div><div class="eyebrow">PACKING CHECKLIST</div><h1>行李清單</h1><p class="sub">3 天、5 天、10 天，依旅行長度準備。</p></div></div><article class="doc packing-doc">${DATA.packing}</article>${footer()}`;}

function secondary(){const wish=view==='wishlist';return `<div class="heading"><div><div class="eyebrow">${wish?'PLACES TO GO':'TRAVEL YOUR WAY'}</div><h1>${wish?'想去的地方':'我的旅遊偏好'}</h1><p class="sub">${wish?'下一次旅行，從一個想法開始。':'讓每次規劃，都更貼近自己的步調。'}</p></div></div><article class="doc">${DATA[view]}</article><section class="empty" style="margin-top:22px"><h2>${wish?'記下下一站':'讓下一趟更適合你'}</h2><p>在專案中告訴旅行助手，整理後就能更新到手帳。</p><code>${wish?'用 $travel-manager 把京都加入願望清單，想在秋天去看楓葉。':'幫我記住旅遊偏好：每天最多安排兩個主要景點，留時間散步。'}</code></section>${footer()}`;}
function render(){main.innerHTML=view==='home'?home():view==='trip'?detail():view==='packing'?packing():secondary();document.getElementById('crumb').textContent={home:'總覽',trip:trip.title,packing:'行李清單',wishlist:'想去的地方',preferences:'旅遊偏好'}[view];document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-top')){window.scrollTo({top:0,behavior:'smooth'});return;}if(b.hasAttribute('data-close-photo')){document.getElementById('photo-dialog').close();return;}if(b.dataset.photo){const dialog=document.getElementById('photo-dialog');document.getElementById('photo-title').textContent=trip.title;const img=document.getElementById('photo-image');img.src=b.dataset.photo;img.alt=b.dataset.alt;document.getElementById('photo-caption').textContent=b.dataset.caption||'';dialog.showModal();return;}if(b.hasAttribute('data-copy')){const status=main.querySelector('.copy-status');try{await navigator.clipboard.writeText(document.getElementById('trip-request').value);status.textContent='已複製';}catch{document.getElementById('trip-request').select();status.textContent='請複製已選取的文字';}return;}if(b.hasAttribute('data-collapse')){collapsed=!collapsed;render();return;}if(b.dataset.trip){const selected=DATA.trips.find(t=>t.id===b.dataset.trip);if(!selected)return;trip=selected;day=0;collapsed=false;view='trip';render();window.scrollTo(0,0);}else if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0);}else if(b.dataset.day!==undefined){const next=Number(b.dataset.day);if(next<0||next>=trip.days.length)return;day=next;collapsed=false;render();main.querySelector('.days .current')?.scrollIntoView({block:'nearest',inline:'center'});if(matchMedia('(max-width:650px)').matches)main.querySelector('.day-layout')?.scrollIntoView({block:'start'});}});
window.addEventListener('scroll',()=>{document.querySelector('[data-top]').hidden=window.scrollY<350;},{passive:true});
render();
</script></body></html>
